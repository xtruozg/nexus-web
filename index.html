<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>Thị trường | Nexus Exchange</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body data-page="markets" data-shell="app" data-dock>
  <main>
    <!-- 1. Market ticker bar -->
    <section class="ticker-bar section">
      <div class="container ticker-bar__inner" id="ticker"></div>
    </section>

    <!-- 2. Live markets -->
    <section class="section markets">
      <div class="container flex col gap-md">
        <div class="panel markets__head">
          <div class="flex items-center gap-md wrap">
            <div class="flex items-center gap-xs">
              <span class="dot dot--lg dot--vip"></span>
              <h1 class="t-headline-md fw-700">Thị Trường Trực Tiếp</h1>
            </div>
            <div class="seg" id="market-tabs" role="tablist"></div>
          </div>
          <div class="flex items-center gap-sm">
            <label class="input-group markets__search">
              <span class="icon icon-18">search</span>
              <input class="input input--flat" id="market-search" type="text" placeholder="Tìm cặp tiền (BTC, ETH, XAUT)...">
            </label>
            <button type="button" class="filter-btn hide-xs" id="filter-btn"><span class="icon icon-16">filter_list</span><span>Bộ lọc</span></button>
          </div>
        </div>

        <div class="panel markets__table">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th class="th-sort" data-sort="base" style="min-width:200px">Cặp giao dịch</th>
                  <th class="th-sort text-right" data-sort="price" style="min-width:130px">Giá mới nhất</th>
                  <th class="th-sort text-right" data-sort="change" style="min-width:110px">Biến động 24h</th>
                  <th class="th-sort text-right hide-xs" data-sort="volumeUsd" style="min-width:140px">Khối lượng 24h</th>
                  <th class="text-center hide-sm" style="min-width:140px">Xu hướng (7D)</th>
                  <th class="text-right" style="min-width:120px">Hành động</th>
                </tr>
              </thead>
              <tbody id="market-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. VIP tiers -->
    <section class="section vip" id="vip">
      <div class="container flex col gap-lg">
        <div class="vip-banner" id="vip-banner"></div>
        <div class="vip-grid" id="vip-grid"></div>
      </div>
    </section>

    <!-- 4. Trust -->
    <section class="section trust">
      <div class="container trust__grid" id="trust"></div>
    </section>
  </main>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages/home.js"></script>
</body>
</html>
